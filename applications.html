<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить заявку - Дайв-тур</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        header iframe {
            display: block;
            background-color: #e0e0e0;
            border: none;
            width: 100%;
            height: 60px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .application-section {
            background: url('assets/images/риф.jpg') center/cover no-repeat;
            padding: 60px 0;
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .application-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .application-section .container {
            position: relative;
            z-index: 2;
        }

        .application-form-wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(30, 100, 180, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px 50px;
            border: 2px solid rgba(100, 180, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .application-title {
            text-align: center;
            color: #fff;
            font-size: 2em;
            margin-bottom: 35px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .application-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #fff;
            font-weight: 600;
            font-size: 0.95em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .form-group input {
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            background-color: #fff;
            color: #333;
            transition: box-shadow 0.3s, transform 0.2s;
            font-family: Arial, sans-serif;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(100, 180, 255, 0.6);
            transform: translateY(-2px);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .submit-group {
            justify-content: flex-end;
        }

        .btn-submit {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            height: fit-content;
            align-self: flex-end;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        @media (max-width: 768px) {
            .application-form-wrapper {
                padding: 30px 25px;
                border-radius: 20px;
            }

            .application-title {
                font-size: 1.6em;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .btn-submit {
                width: 100%;
                align-self: stretch;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .application-form-wrapper {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <iframe src="navigation.html" width="100%" height="60" frameborder="0"></iframe>
    </header>

    <        class="application-section">
        <div class="container">
            <div class="application-form-wrapper">
                <h1 class="application-title">Оставить заявку</h1>

                <form class="application-form" action="#" method="POST">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">Ваше имя</label>
                            <input type="text" id="firstname" name="firstname" placeholder="Введите ваше имя" required>
                        </div>
                        <div class="form-group">
                            <label for="lastname">Ваша фамилия</label>
                            <input type="text" id="lastname" name="lastname" placeholder="Введите вашу фамилию" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="tour-name">Введите название тура</label>
                            <input type="text" id="tour-name" name="tour-name" placeholder="Введите название тура" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Введите ваш номер телефона</label>
                            <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">Введите ваш возраст</label>
                            <input type="text" id="age" name="age" placeholder="xx.xx.xxxx" required>
                        </div>
                        <div class="form-group submit-group">
                            <label>&nbsp;</label>
                            <button type="submit" class="btn-submit">Оформить заявку</button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </section>

</body>
</html>
