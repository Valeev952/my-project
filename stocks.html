<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акция - В гостях у акул</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: #e0e0e0; 
            padding: 0;
            border-bottom: 1px solid #ccc;
        }

        header iframe {
            width: 100%;
            height: 60px;
            border: none;
            display: block;
        }

        .promo-section {
            background-color: #e0e0e0; 
            padding: 40px 20px; 
            display: flex;
            justify-content: center;
        }

        .promo-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px; 
            min-height: 600px;
            border-radius: 8px; 
            overflow: hidden; 
            
            background: url('assets/images/акулы.jpg') center/cover no-repeat;
            
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .promo-card {
            position: absolute;
            top: 40px;
            left: 40px;
            
            background-color: rgba(0, 120, 135, 0.75); 
            backdrop-filter: blur(5px); 
            -webkit-backdrop-filter: blur(5px);
            
            padding: 40px;
            max-width: 400px; 
            border-radius: 8px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .promo-card h1 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .promo-card p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .promo-card strong {
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .promo-wrapper {
                min-height: 500px;
            }
            
            .promo-card {
                position: relative; 
                top: 0;
                left: 0;
                max-width: 100%;
                margin: 0;
                border-radius: 0;
                background-color: rgba(0, 80, 100, 0.9);
            }
        }
    </style>
</head>
<body>

    <header>
        <iframe src="navigation.html" width="100%" height="60" frameborder="0"></iframe>
    </header>

    <section class="promo-section">
        <div class="promo-wrapper">
            
            <div class="promo-card">
                <h1>В гостях у акул</h1>
                <p><strong>«Приведи команду — нырните дешевле»</strong></p>
                <p>
                    Совместное погружение с акулами: собирайте компанию из 3 человек и получайте скидку 20% на каждого.
                </p>
                <p>
                    Адреналин делить веселее, а страх — наполовину. Акция действует до конца месяца. Количество мест ограничено.
                </p>
            </div>

        </div>
    </section>

</body>
</html>
